name: Build Android APK

on:
  push:
    branches: [ master, main, feat/* ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # 支持在 GitHub 仓库 Actions 页面手动点击一键编译

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
          build-root-directory: android_app
          arguments: assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          ls -lh android_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZDT-Stage-Android-v1.0.0-Debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
